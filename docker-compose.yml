services:
  mongo:
    image: mongo:latest
    restart: always
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DB_URI=mongodb://mongo:27017/Database
      - JWT_SECRET_KEY=dev-secret-key-12345
    depends_on:
      - mongo
    # Uncomment the following line if you want to develop locally and see changes without rebuilding
    # volumes:
    #   - .:/app

volumes:
  mongo-data:
